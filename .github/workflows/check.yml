name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  flight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-flight.txt
      - run: python -m pip install -r requirements-flight.txt
      - run: python -m duet.bootstrap
      - run: python -m unittest discover -s tests -v
      - run: python -m duet.record --prepare-only
  portable-scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-metal.txt
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-metal.txt
      - run: python -m duet.bootstrap
      - run: python -m unittest discover -s tests -v
